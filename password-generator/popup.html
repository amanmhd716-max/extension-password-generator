<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quick Password Generator</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="container">
    <h1>Password Generator</h1>

    <div class="output-row">
      <input type="text" id="password-output" readonly aria-label="Generated password" placeholder="Click Generate" />
      <button id="copy-btn" class="icon-btn" title="Copy to clipboard" aria-label="Copy password">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
          <path fill="currentColor" d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/>
        </svg>
      </button>
    </div>
    <p id="copy-feedback" class="feedback" role="status"></p>

    <div class="options">
      <div class="option-row">
        <label for="length-input">Length</label>
        <input type="number" id="length-input" min="4" max="64" value="16" />
      </div>

      <div class="option-row checkbox-row">
        <label><input type="checkbox" id="opt-uppercase" checked /> Uppercase (A-Z)</label>
      </div>
      <div class="option-row checkbox-row">
        <label><input type="checkbox" id="opt-lowercase" checked /> Lowercase (a-z)</label>
      </div>
      <div class="option-row checkbox-row">
        <label><input type="checkbox" id="opt-numbers" checked /> Numbers (0-9)</label>
      </div>
      <div class="option-row checkbox-row">
        <label><input type="checkbox" id="opt-symbols" checked /> Symbols (!@#$...)</label>
      </div>
    </div>

    <button id="generate-btn" class="primary-btn">Generate Password</button>
  </main>

  <script src="popup.js"></script>
</body>
</html>
